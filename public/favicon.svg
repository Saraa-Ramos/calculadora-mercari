<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aa8ea"/>
      <stop offset="100%" stop-color="#1f6fc4"/>
    </linearGradient>
  </defs>

  <!-- Fondo azul redondeado -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Cuerpo de la calculadora -->
  <rect x="14" y="11" width="36" height="42" rx="5" fill="#ffffff"/>

  <!-- Pantalla -->
  <rect x="19" y="16" width="26" height="10" rx="2.5" fill="#1f6fc4"/>

  <!-- Teclas: 3 columnas x 3 filas -->
  <g fill="#2b86dd">
    <rect x="19"   y="31"   width="6.5" height="5.5" rx="1.8"/>
    <rect x="28.75" y="31"   width="6.5" height="5.5" rx="1.8"/>
    <rect x="38.5" y="31"   width="6.5" height="5.5" rx="1.8"/>

    <rect x="19"   y="39.5" width="6.5" height="5.5" rx="1.8"/>
    <rect x="28.75" y="39.5" width="6.5" height="5.5" rx="1.8"/>
    <rect x="38.5" y="39.5" width="6.5" height="5.5" rx="1.8"/>

    <rect x="19"   y="48"   width="16.25" height="5" rx="1.8"/>
  </g>

  <!-- Tecla "=" destacada -->
  <rect x="38.5" y="48" width="6.5" height="5" rx="1.8" fill="#0f9d6e"/>
</svg>
